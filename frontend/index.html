<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Temperature Predictor</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
    h1   { font-size: 1.4rem; margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 12px; font-size: 0.95rem; color: #444; }
    input, select { width: 100%; padding: 8px; margin-top: 4px;
                    border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #2563eb; color: white;
             border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-top: 8px; }
    button:hover { background: #1d4ed8; }
    #result { margin-top: 20px; padding: 16px; background: #f0fdf4;
              border: 1px solid #86efac; border-radius: 4px; display: none; }
    .error  { background: #fef2f2; border-color: #fca5a5; }
  </style>
</head>
<body>

  <h1>🌦️ Weather Temperature Predictor</h1>

  <label>
    Humidity (normalized z-score)
    <input type="number" id="humidity" step="0.01" value="0.81" placeholder="e.g. 0.81">
  </label>

  <label>
    Wind Speed (normalized z-score)
    <input type="number" id="wind_speed" step="0.01" value="-0.13" placeholder="e.g. -0.13">
  </label>

  <label>
    Weather Condition
    <select id="condition">
      <option value="0">Light Rain (0)</option>
      <option value="1">Clear Sky (1)</option>
      <option value="2">Overcast Clouds (2)</option>
      <option value="3">Broken Clouds (3)</option>
    </select>
  </label>

  <button onclick="predict()">Predict Temperature</button>

  <div id="result"></div>

  <script>
    async function predict() {
      const resultDiv = document.getElementById("result");
      resultDiv.className = "";
      resultDiv.style.display = "block";
      resultDiv.textContent   = "Predicting...";

      try {
        const response = await fetch("http://localhost:5000/predict", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            humidity:          parseFloat(document.getElementById("humidity").value),
            wind_speed:        parseFloat(document.getElementById("wind_speed").value),
            condition_encoded: parseInt(document.getElementById("condition").value),
          }),
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.textContent = `Predicted Temperature: ${data.predicted_temperature} °C`;
        } else {
          resultDiv.className   = "error";
          resultDiv.textContent = `Error: ${data.error}`;
        }
      } catch (err) {
        resultDiv.className   = "error";
        resultDiv.textContent = "Could not reach the server. Is Flask running on port 5000?";
      }
    }
  </script>

</body>
</html>
