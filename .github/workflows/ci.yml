name: CI — Test and Build

# Trigger: any push to staging, or a PR targeting staging
on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:

  # ---------------------------------------------------------------
  # JOB 1: Run unit tests
  # ---------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  # ---------------------------------------------------------------
  # JOB 2: Build and push Docker image
  # Only runs if the test job passes (needs: test)
  # ---------------------------------------------------------------
  build_and_push:
    runs-on: ubuntu-latest
    needs: test                   # blocked until test job succeeds
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/weather-mlops:latest -f dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/weather-mlops:latest